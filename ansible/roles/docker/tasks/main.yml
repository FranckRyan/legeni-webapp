---
- name: Prérequis (dont les bibliothèques Python des modules community.docker et kubernetes.core)
  ansible.builtin.apt:
    name: "{{ ['ca-certificates', 'curl', 'gnupg', 'jq', 'openssl'] + docker_python_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé GPG officielle de Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Le fichier entier est géré (et non une ligne ajoutée) : on évite les doublons « Signed-By »
# si Docker avait déjà été installé à la main avec une autre clé.
- name: Dépôt Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: >
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
  register: depot_docker

- name: Ancienne clé (installation manuelle) retirée
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent

- name: Mettre à jour l'index APT si le dépôt a changé
  ansible.builtin.apt:
    update_cache: true
  when: depot_docker is changed

- name: Paquets Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  notify: Redémarrer docker

- name: Service Docker démarré et activé
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Utilisateurs autorisés à utiliser Docker sans sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
