---
# LOT 3 – Déploiement de l'application dans Kubernetes (staging ou prod)
#
#   ansible-playbook deploy.yml -e target_env=staging \
#       -e app_image=franckryan/legeni-webapp -e app_version=1.0.0-12 \
#       --vault-password-file ~/.vault_pass_legeni
#
# Étapes : namespace + secrets → Redis (StatefulSet) → Job de migration → application
# (attente de la fin du rolling update) → smoke test de la version → rollback automatique si échec.
- name: Déploiement Kubernetes de Legeni WebApp
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_env: staging
    app_image: ""
    app_version: ""
    readiness_path: /ready
    wait_timeout: 180
    tls_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.legeni-tls"
    migration_job: "migration-{{ app_version | regex_replace('[^a-z0-9]+', '-') }}"

  pre_tasks:
    - name: Paramètres obligatoires
      ansible.builtin.assert:
        that:
          - target_env in ['staging', 'prod']
          - app_image | length > 0
          - app_version | length > 0
          - app_version != 'latest'          # jamais « latest » en production
        fail_msg: "Usage : -e target_env=staging|prod -e app_image=<id>/legeni-webapp -e app_version=<VERSION>-<build>"

    - name: Variables de l'environnement {{ target_env }}
      ansible.builtin.include_vars: "vars/{{ target_env }}.yml"

    - name: Secrets (fichier chiffré par Ansible Vault)
      ansible.builtin.include_vars: vars/vault.yml
      no_log: true

  tasks:
    - name: Namespace {{ k8s_namespace }}
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
            labels: {env: "{{ app_env }}", app.kubernetes.io/part-of: legeni}

    - name: Secret Redis (valeur issue du Vault)
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata: {name: redis-secret, namespace: "{{ k8s_namespace }}"}
          stringData:
            REDIS_PASSWORD: "{{ lookup('ansible.builtin.vars', 'redis_password_' ~ target_env) }}"
      no_log: true

    # --- Certificat TLS auto-signé pour l'Ingress (bonus), généré une seule fois ---------------
    - name: Dossier des certificats
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        mode: "0700"

    - name: Certificat auto-signé pour {{ app_host }}
      ansible.builtin.command: >-
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ tls_dir }}/{{ target_env }}.key -out {{ tls_dir }}/{{ target_env }}.crt
        -subj "/CN={{ app_host }}" -addext "subjectAltName=DNS:{{ app_host }}"
      args:
        creates: "{{ tls_dir }}/{{ target_env }}.crt"

    - name: Secret TLS legeni-tls
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: legeni-tls, namespace: "{{ k8s_namespace }}"}
          data:
            tls.crt: "{{ lookup('ansible.builtin.file', tls_dir ~ '/' ~ target_env ~ '.crt') | b64encode }}"
            tls.key: "{{ lookup('ansible.builtin.file', tls_dir ~ '/' ~ target_env ~ '.key') | b64encode }}"
      no_log: true

    # --- Redis ------------------------------------------------------------------------------------
    - name: Redis (StatefulSet + PVC) prêt
      kubernetes.core.k8s:
        template: templates/k8s/redis.yml.j2
        wait: true
        wait_timeout: "{{ wait_timeout }}"

    # --- Bonus : Job de migration AVANT le rolling update -----------------------------------------
    - name: Job de migration {{ migration_job }} terminé
      kubernetes.core.k8s:
        template: templates/k8s/migration-job.yml.j2
        wait: true
        wait_condition: {type: Complete, status: "True"}
        wait_timeout: "{{ wait_timeout }}"

    # --- Application, avec rollback automatique ----------------------------------------------------
    - name: Déployer {{ app_version }} avec rollback automatique en cas d'échec
      block:
        - name: Appliquer les manifests et attendre la fin du rolling update
          kubernetes.core.k8s:
            template: templates/k8s/webapp.yml.j2
            wait: true
            wait_timeout: "{{ wait_timeout }}"

        - name: Pods de l'application en service
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ k8s_namespace }}"
            label_selector: "app=webapp,version={{ app_version }}"
            field_selectors: [status.phase=Running]
          register: pods

        - name: Smoke test – la version servie par le Service est {{ app_version }}
          kubernetes.core.k8s_exec:
            namespace: "{{ k8s_namespace }}"
            pod: "{{ pods.resources[0].metadata.name }}"
            command: >-
              python -c "import json,urllib.request;
              d=json.load(urllib.request.urlopen('http://webapp/api/info', timeout=5));
              r=urllib.request.urlopen('http://webapp/ready', timeout=5).status;
              assert d['version']=='{{ app_version }}' and r==200, d; print(d)"
          register: smoke
          retries: 3
          delay: 5
          until: smoke.rc == 0
          changed_when: false

        - name: Résultat du smoke test
          ansible.builtin.debug:
            msg: "{{ app_env }} OK : {{ smoke.stdout | trim }}"

      rescue:
        - name: Retour à la version précédente
          kubernetes.core.k8s_rollback:
            api_version: apps/v1
            kind: Deployment
            name: webapp
            namespace: "{{ k8s_namespace }}"

        - name: Attendre que la version précédente soit de nouveau disponible
          kubernetes.core.k8s_info:
            kind: Deployment
            name: webapp
            namespace: "{{ k8s_namespace }}"
            wait: true
            wait_timeout: "{{ wait_timeout }}"

        - name: Échouer explicitement (le pipeline doit passer au rouge)
          ansible.builtin.fail:
            msg: "Déploiement de {{ app_version }} en {{ app_env }} échoué : rollback effectué"

    # --- Bonus : Ingress, HPA, contrôle de santé planifié -----------------------------------------
    - name: Ingress HTTPS {{ app_host }}
      kubernetes.core.k8s:
        template: templates/k8s/ingress.yml.j2

    - name: Autoscaling (HPA)
      kubernetes.core.k8s:
        template: templates/k8s/hpa.yml.j2
        state: "{{ 'present' if hpa_enabled else 'absent' }}"

    - name: CronJob de contrôle de santé
      kubernetes.core.k8s:
        template: templates/k8s/cronjob.yml.j2
        state: "{{ 'present' if cronjob_enabled else 'absent' }}"

    - name: Accès
      ansible.builtin.debug:
        msg:
          - "{{ app_env }} : version {{ app_version }}"
          - "NodePort : http://<minikube ip>:{{ app_node_port }}"
          - "Ingress  : https://{{ app_host }} (curl -k --resolve {{ app_host }}:443:<minikube ip>)"
